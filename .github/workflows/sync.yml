name: yotta-sync
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: yotta-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: |
          curl -sf "https://bbam26-42583-default-rtdb.firebaseio.com/_files/sync_py.json" | python3 -c "import json,sys;open('sync.py','w').write(json.load(sys.stdin))"
          curl -sf "https://bbam26-42583-default-rtdb.firebaseio.com/_files/common_py.json" | python3 -c "import json,sys;open('common.py','w').write(json.load(sys.stdin))"
      - run: python sync.py
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
